# Card data for the `work` content collection. Copy is final (from the design canvas, 2026-11-20).
# All five projects are published and have case-study pages.
# homeCard: shown in Home "Selected work" (in this order). portfolioLayout: wide | grid.

projects:
  - slug: freight-rate-sheet-generator
    title: Automated Customer Pricing System
    homeCardTitle: Customer pricing system
    portfolioCardTitle: Customer pricing system
    footerLabel: Customer pricing system
    moreLabel: Customer Pricing System # label in "More case studies"
    order: 1
    homeCard: 1
    portfolioLayout: wide
    featured: true
    tags: [Operational application]
    ownProject: false
    cardSummary: The team updates freight costs once, and every customer's routes are repriced automatically, ready for branded price lists generated with one click.
    problem: Every couple of weeks, as freight costs and available shipping lanes changed, each customer's price list (a freight rate sheet) had to be updated by hand, rematching their routes, reapplying their pricing rules and handling exceptions case by case.
    built: A custom web application where the team updates freight costs and lanes once. Every customer's routes are rematched and repriced automatically, a person reviews any exceptions, and up-to-date branded price lists are generated with one click.

  - slug: gridbloom
    title: 'GridBloom: electricity data you can check'
    homeCardTitle: GridBloom electricity data
    portfolioCardTitle: GridBloom electricity data dashboard
    footerLabel: GridBloom
    moreLabel: GridBloom electricity data
    order: 2
    homeCard: 3
    portfolioLayout: wide
    featured: false
    tags: [Reporting and AI-assisted workflow]
    ownProject: true # renders the "Independent project" tag
    cardSummary: "A weekly report that builds itself from messy data and refuses to show numbers the data can't support, including in its AI-written summary."
    problem: 'Reports built from several data sources often hide gaps, late updates and bad values. Added up blindly, or summarized by AI without checks, they show confident numbers that are wrong. This demo uses public electricity data to show how to prevent that.'
    built: "A pipeline that imports and checks the data, then produces a dashboard and weekly email report that leave out figures the data can't support, with an AI summary whose every number is checked against its sources."

  - slug: pr-pipeline-sync
    title: One master pipeline, thirty client trackers
    homeCardTitle: PR pipeline sync
    portfolioCardTitle: PR pipeline and client tracker sync
    footerLabel: PR pipeline sync
    moreLabel: PR pipeline sync
    order: 3
    homeCard: 2
    portfolioLayout: grid
    tags: [Integration and data sync]
    ownProject: false
    cardSummary: "One update in a PR agency's master pipeline now reaches about 30 client trackers, instead of being copied into each one by hand."
    problem: "A PR agency's staff were copying roughly 850 new opportunities a month, plus every later update, from their master pipeline into about 30 client trackers by hand, because the automation meant to do it wasn't working well."
    built: "An automation inside the agency's own Google Workspace that publishes each opportunity to the right client's tracker with one checkbox, then keeps it up to date from first pitch to secured coverage."

  - slug: quotes-library
    title: From a cluttered workbook to a 400-page reference
    homeCardTitle: null # not on Home
    portfolioCardTitle: 'Quotes library: Excel to Word'
    footerLabel: Quotes library
    moreLabel: Quotes library
    order: 4
    homeCard: null
    portfolioLayout: grid
    tags: [Data cleanup and document generation]
    ownProject: false
    cardSummary: null
    problem: "A client's large quotations collection had grown messy across many Excel worksheets, full of repeats and near-copies, with no readable way to browse it. Cleaning and formatting it by hand would have taken days."
    built: 'A cleanup that removed true duplicates without losing any categories, a report of near-copies for the client to review, and a generated 400-page Word reference organized by author, delivered in three days.'

  - slug: volunteer-rosters
    title: Two sign-up tools, one clean roster per location
    homeCardTitle: null # not on Home
    portfolioCardTitle: Volunteer registration and rosters
    footerLabel: Volunteer rosters
    moreLabel: Volunteer rosters
    order: 5
    homeCard: null
    portfolioLayout: grid
    tags: [Integration and data sync]
    ownProject: false
    cardSummary: null
    problem: "A four-location volunteer program took sign-ups through two different tools. Coordinators had to download reports and piece them into each location's roster by hand, without duplicating returning volunteers or losing notes they had added."
    built: "An integration that brings every sign-up into the right location's roster automatically, recognizes returning volunteers, and never overwrites what coordinators have added."

